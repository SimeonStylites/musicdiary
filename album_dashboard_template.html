<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fully listened albums in Spotify</title>
<style>
  :root {
    --bg: #121212;
    --panel: #181818;
    --panel-hover: #232323;
    --border: rgba(255,255,255,.09);
    --text: #ffffff;
    --muted: #b3b3b3;
    --green: #1DB954;
    --green-dim: rgba(29,185,84,.35);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    flex: 0 0 auto;
    padding: 18px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 20px; letter-spacing: -.2px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .chart-wrap {
    flex: 1 1 auto;
    min-height: 0;
    padding: 0 24px 28px;
    overflow: auto;
  }
  .chart { min-width: 780px; max-width: 1500px; margin: 16px auto 0; }

  .dash-header-row {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
    display: flex;
    align-items: stretch;
    border-bottom: 1px solid var(--border);
  }
  .name-cell {
    width: 210px;
    min-width: 210px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px 0 6px;
    font-size: 12px;
    font-weight: 600;
  }
  .dash-header-row .name-cell { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; align-items: flex-start; padding-top: 10px; }
  .years-cell { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .bars-row { height: 220px; display: flex; gap: 2px; padding: 0 4px; align-items: stretch; }
  .bar-col {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    height: 100%;
    padding-bottom: 2px;
  }
  .bar-value {
    height: 16px;
    font-size: 10px;
    font-weight: 700;
    color: var(--green);
    line-height: 16px;
  }
  .bar-track {
    position: relative;
    width: 100%;
    min-height: 2px;
    border-radius: 3px 3px 0 0;
    background: linear-gradient(180deg, rgba(29,185,84,.75), rgba(29,185,84,.25));
    transition: opacity .15s, background .15s;
  }
  .bar-share {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 0;
    background: var(--green);
    border-radius: 3px 3px 0 0;
    transition: height .15s, opacity .15s;
    box-shadow: 0 0 10px rgba(29,185,84,.55);
    cursor: help;
  }

  body.hov .bar-col.hit .bar-track { opacity: 1; }
  body.hov .bar-col.hit .bar-track .bar-value { color: var(--green); }
  body.hov .bar-col:not(.hit) .bar-track { opacity: .14; }
  body.hov .bar-col:not(.hit) .bar-value { color: rgba(255,255,255,.25); }
  body.hov .year-label.year-hit { color: var(--green); font-weight: 700; }

  .year-labels { display: flex; gap: 2px; padding: 8px 4px 36px; }
  .year-label {
    flex: 1 1 0;
    min-width: 0;
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    white-space: nowrap;
  }

  .artist-row {
    display: flex;
    align-items: center;
    height: 28px;
    border-radius: 6px;
    transition: background .15s;
  }
  .artist-row:hover, .artist-row.active { background: var(--panel-hover); cursor: default; }
  .artist-row .name-cell { height: 100%; }
  .artist-row .nm {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 12px;
    font-weight: 600;
  }
  .artist-row.active .nm { white-space: normal; overflow: visible; }
  .artist-row .tot {
    margin-left: auto;
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .artist-row.active .tot { color: var(--green); }

  .dots-row { flex: 1; min-width: 0; display: flex; gap: 2px; padding: 0 4px; align-items: center; height: 100%; }
  .dot-cell {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dot-cell svg { display: block; }
  .dot-cell circle {
    fill: var(--green);
    opacity: .65;
    transition: opacity .15s;
  }
  .artist-row.active .dot-cell circle,
  body.hov .artist-row.active .dot-cell circle { opacity: 1; }
  body.hov .artist-row:not(.active) .dot-cell circle { opacity: .18; }

  .legend {
    margin: 16px 0 0;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }
  .legend .chip { display: inline-flex; align-items: center; gap: 7px; }
  .legend .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .legend .dot-swatch { width: 12px; height: 12px; border-radius: 50%; display: inline-block; background: var(--green); }

  .tooltip {
    position: fixed;
    z-index: 100;
    display: none;
    min-width: 180px;
    max-width: 340px;
    background: #282828;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,.6);
    pointer-events: none;
  }
  .tooltip .tt-artist { font-weight: 700; font-size: 13px; margin-bottom: 2px; }
  .tooltip .tt-year { color: var(--muted); font-size: 11px; margin-bottom: 6px; }
  .tooltip .tt-list { display: flex; flex-direction: column; gap: 3px; font-size: 12px; }
  .tooltip .tt-album { display: flex; justify-content: space-between; gap: 12px; }
  .tooltip .tt-name { color: var(--text); }
  .tooltip .tt-plays { color: var(--green); font-variant-numeric: tabular-nums; }

  .tabs { display: flex; gap: 8px; margin-top: 14px; }
  .tabs[hidden] { display: none; }
  .tabs.subtabs { margin-top: 8px; }
  .tab {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .tab.active { background: var(--green); border-color: var(--green); color: #0b0b0b; }
  .gs-head { display: flex; align-items: baseline; gap: 12px; margin: 4px 0 10px; }
  .gs-head .gs-title { font-size: 15px; font-weight: 700; }
  .gs-head .gs-sub { color: var(--muted); font-size: 12px; }
  .gs-back {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 4px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
  }
  .gs-back:hover, .gs-pagebtn:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
  .gs-row {
    display: flex;
    align-items: center;
    height: 32px;
    padding: 0 10px;
    border-radius: 6px;
    font-size: 13px;
    gap: 10px;
  }
  .gs-row.click:hover { background: var(--panel-hover); cursor: pointer; }
  .gs-row.hl .gs-artist { color: var(--green); }
  .gs-row .gs-name {
    flex: 0 0 360px;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 600;
  }
  .gs-row .gs-artist {
    flex: 0 0 300px;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--muted);
  }
  .gs-row .gs-plays {
    flex: 0 0 64px;
    color: var(--green);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .gs-tracks { margin: 2px 0 6px 22px; border-left: 1px solid var(--border); padding-left: 10px; }
  .gs-track {
    display: flex;
    align-items: center;
    height: 26px;
    gap: 10px;
    font-size: 12px;
    color: var(--muted);
  }
  .gs-track .gs-tname {
    flex: 0 0 320px;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .gs-track .gs-tplays {
    flex: 0 0 64px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .gs-pager { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 14px; }
  .gs-pager .gs-pageinfo { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .gs-pagebtn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 4px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
  }
  .gs-pagebtn:disabled { opacity: .35; cursor: default; }

  .dyn-axis, .dyn-row { display: flex; align-items: center; height: 28px; gap: 10px; padding: 0 10px; }
  .dyn-axis { height: 22px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
  .dyn-name {
    flex: 0 0 300px; min-width: 0; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; font-size: 13px; font-weight: 600;
  }
  .dyn-axis .dyn-name { visibility: hidden; }
  .dyn-plot { position: relative; flex: 1 1 auto; min-width: 0; height: 100%; }
  .dyn-axis .dyn-plot { height: 100%; }
  .dyn-tick {
    position: absolute; top: 4px; transform: translateX(-50%);
    font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .dyn-tick::before {
    content: ''; position: absolute; left: 50%; top: -4px; height: 6px;
    border-left: 1px solid var(--border);
  }
  .dyn-grid { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--border); opacity: .4; }
  .dyn-row:hover { background: var(--panel-hover); }
  .dyn-line {
    position: absolute; top: 50%; transform: translateY(-50%);
    height: 2px; background: var(--green-dim);
  }
  .dyn-dot {
    position: absolute; top: 50%; width: 8px; height: 8px; border-radius: 50%;
    background: var(--green); transform: translate(-50%, -50%); z-index: 1;
  }
  .dyn-dot.nth { background: #fff; }
  .dyn-val {
    flex: 0 0 64px; text-align: right; color: var(--green);
    font-weight: 700; font-variant-numeric: tabular-nums; font-size: 13px;
  }

  .gen-section { margin-top: 22px; }
  .gen-section h2 {
    margin: 0 0 10px; font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .6px; color: var(--muted);
  }
  .gen-grid {
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  }
  .gen-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 18px;
  }
  .gen-value {
    font-size: 26px; font-weight: 700; color: var(--green);
    font-variant-numeric: tabular-nums; line-height: 1.15;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .gen-label { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .gen-card .gen-sub {
    margin-top: 4px; font-size: 12px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
</style>
</head>
<body>
<header>
  <h1>Your Music Metrics</h1>
  <p id="viewdesc">Top: full album plays by the album's release year. Below: artists sorted by total plays, dots show their plays in each year (shared year axis). Hover an artist or a dot to see the albums and the artist's share in the bars.</p>
  <div class="tabs" id="tabs" hidden>
    <button class="tab active" data-view="general">General</button>
    <button class="tab" data-view="tracks">Tracks</button>
    <button class="tab" data-view="artists">Artists</button>
    <button class="tab" data-view="albums">Albums</button>
  </div>
  <div class="tabs subtabs" id="subtabs" hidden></div>
</header>
<div class="chart-wrap">
  <div class="chart" id="generalview" hidden></div>
  <div class="chart" id="tracksview" hidden></div>
  <div class="chart" id="tracksdyn" hidden></div>
  <div class="chart" id="statsview" hidden></div>
  <div class="chart" id="artistsdyn" hidden></div>
  <div class="chart" id="albumlist" hidden></div>
  <div class="chart" id="chart"></div>
</div>
<div class="tooltip" id="tooltip"></div>

<script>
const D = __DATA__;
const SVGNS = 'http://www.w3.org/2000/svg';
const BAR_H = 220;
const VALUE_H = 16;
const USEFUL_H = BAR_H - VALUE_H - 4;

const chart = document.getElementById('chart');
const tooltip = document.getElementById('tooltip');
const tipData = new Map();
const shareTip = new Map();
const years = D.years;
const totals = D.plays_by_year;
const maxTotal = Math.max(...years.map(y => totals[y] || 0));

function buildTooltip(a, y, plays, albums) {
  tooltip.innerHTML = '';
  const tArtist = document.createElement('div');
  tArtist.className = 'tt-artist';
  tArtist.textContent = a;
  const tYear = document.createElement('div');
  tYear.className = 'tt-year';
  tYear.textContent = y + ' — ' + plays + ' full album plays';
  tooltip.appendChild(tArtist);
  tooltip.appendChild(tYear);
  const list = document.createElement('div');
  list.className = 'tt-list';
  albums.forEach(al => {
    const row = document.createElement('div');
    row.className = 'tt-album';
    const nm = document.createElement('span');
    nm.className = 'tt-name';
    nm.textContent = al.name;
    const pl = document.createElement('span');
    pl.className = 'tt-plays';
    pl.textContent = 'x' + al.plays;
    row.appendChild(nm);
    row.appendChild(pl);
    list.appendChild(row);
  });
  tooltip.appendChild(list);
}

function moveTip(e) {
  const w = tooltip.offsetWidth;
  let x = e.clientX + 16;
  if (x + w > window.innerWidth - 8) x = e.clientX - w - 16;
  tooltip.style.left = x + 'px';
  tooltip.style.top = (e.clientY + 14) + 'px';
}

function showTip(e, a, y, plays, albums) {
  buildTooltip(a, y, plays, albums);
  tooltip.style.display = 'block';
  moveTip(e);
}

function hideTip() { tooltip.style.display = 'none'; }

// ---------- header row ----------
const headerRow = document.createElement('div');
headerRow.className = 'dash-header-row';

const headName = document.createElement('div');
headName.className = 'name-cell';
headName.textContent = 'Artists';
headerRow.appendChild(headName);

const headerYears = document.createElement('div');
headerYears.className = 'years-cell';

const barsRow = document.createElement('div');
barsRow.className = 'bars-row';

const barCols = [];
years.forEach(y => {
  const col = document.createElement('div');
  col.className = 'bar-col';
  const val = document.createElement('div');
  val.className = 'bar-value';
  val.textContent = totals[y] ? totals[y] : '';
  const track = document.createElement('div');
  track.className = 'bar-track';
  const h = totals[y] ? Math.max((totals[y] / maxTotal) * USEFUL_H, 3) : 0;
  track.style.height = h + 'px';
  const share = document.createElement('div');
  share.className = 'bar-share';
  share.dataset.year = y;
  track.appendChild(share);
  share.addEventListener('mouseenter', (e) => {
    const t = shareTip.get(share);
    if (t) showTip(e, t.artist, t.year, t.plays, t.albums);
  });
  share.addEventListener('mousemove', moveTip);
  share.addEventListener('mouseleave', hideTip);
  col.appendChild(val);
  col.appendChild(track);
  barsRow.appendChild(col);
  barCols.push({ col, val, track, share, year: y });
});

const labelsRow = document.createElement('div');
labelsRow.className = 'year-labels';
const yearLabels = [];
years.forEach(y => {
  const lbl = document.createElement('div');
  lbl.className = 'year-label';
  lbl.textContent = y;
  labelsRow.appendChild(lbl);
  yearLabels.push(lbl);
});

headerYears.appendChild(barsRow);
headerYears.appendChild(labelsRow);
headerRow.appendChild(headerYears);
chart.appendChild(headerRow);

// ---------- artists ----------
const artistsBox = document.createElement('div');
artistsBox.id = 'artistsBox';
chart.appendChild(artistsBox);

function makeArtistRow(a) {
  const row = document.createElement('div');
  row.className = 'artist-row';
  row.dataset.artist = a;

  const nameCell = document.createElement('div');
  nameCell.className = 'name-cell';
  const nm = document.createElement('span');
  nm.className = 'nm';
  nm.textContent = a;
  const tot = document.createElement('span');
  tot.className = 'tot';
  tot.textContent = D.artist_totals[a];
  nameCell.appendChild(nm);
  nameCell.appendChild(tot);

  const dotsRow = document.createElement('div');
  dotsRow.className = 'dots-row';

  const ay = D.artist_year[a] || {};
  const maxA = Math.max(...Object.values(ay), 1);

  years.forEach(y => {
    const cell = document.createElement('div');
    cell.className = 'dot-cell';
    const svg = document.createElementNS(SVGNS, 'svg');
    const v = ay[y] || 0;
    const r = v ? Math.max(3, (v / maxA) * 8) : 0;
    svg.setAttribute('width', '16');
    svg.setAttribute('height', '16');
    const c = document.createElementNS(SVGNS, 'circle');
    c.setAttribute('cx', '8');
    c.setAttribute('cy', '8');
    c.setAttribute('r', r);
    svg.appendChild(c);
    if (v) {
      const albums = (D.artist_year_albums[a] || {})[y] || [];
      tipData.set(svg, { artist: a, year: y, plays: v, albums });
      svg.dataset.artist = a;
      svg.dataset.year = y;
      svg.style.cursor = 'help';
      svg.addEventListener('mouseenter', (e) => {
        const t = tipData.get(svg);
        if (t) showTip(e, t.artist, t.year, t.plays, t.albums);
      });
      svg.addEventListener('mousemove', moveTip);
      svg.addEventListener('mouseleave', hideTip);
    }
    cell.appendChild(svg);
    dotsRow.appendChild(cell);
  });

  row.appendChild(nameCell);
  row.appendChild(dotsRow);
  return row;
}

const rows = D.artists.map(makeArtistRow);
rows.forEach(r => artistsBox.appendChild(r));

// ---------- hover logic ----------
function clearHighlight() {
  hideTip();
  document.body.classList.remove('hov');
  document.querySelectorAll('.artist-row.active').forEach(r => r.classList.remove('active'));
  document.querySelectorAll('.year-label.year-hit').forEach(l => l.classList.remove('year-hit'));
  barCols.forEach(({ track, share }) => {
    track.classList.remove('hit');
    share.style.height = '0px';
    shareTip.delete(share);
  });
}

function highlight(a) {
  clearHighlight();
  document.body.classList.add('hov');
  const ay = D.artist_year[a] || {};
  rows.forEach(r => r.classList.toggle('active', r.dataset.artist === a));
  yearLabels.forEach((lbl, i) => lbl.classList.toggle('year-hit', !!(ay[years[i]] || 0)));

  barCols.forEach(({ col, track, share, year: y }) => {
    const total = totals[y] || 0;
    const v = ay[y] || 0;
    if (v && total) {
      col.classList.add('hit');
      const trackH = track.getBoundingClientRect().height;
      const seg = (v / total) * trackH;
      share.style.height = Math.round(seg) + 'px';
      shareTip.set(share, {
        artist: a,
        year: y,
        plays: v,
        albums: (D.artist_year_albums[a] || {})[y] || []
      });
    } else {
      col.classList.remove('hit');
      share.style.height = '0px';
      shareTip.delete(share);
    }
  });
}

rows.forEach(r => {
  r.addEventListener('mouseenter', () => highlight(r.dataset.artist));
});

artistsBox.addEventListener('mouseleave', clearHighlight);

// ---------- tabs: tracks / artists / albums ----------
if (D.general) {
  const tabs = document.getElementById('tabs');
  const subtabs = document.getElementById('subtabs');
  const generalview = document.getElementById('generalview');
  const tracksview = document.getElementById('tracksview');
  const tracksdyn = document.getElementById('tracksdyn');
  const statsview = document.getElementById('statsview');
  const artistsdyn = document.getElementById('artistsdyn');
  const albumlist = document.getElementById('albumlist');
  const viewdesc = document.getElementById('viewdesc');
  tabs.hidden = false;
  const PAGE = 50;

  const pager = (start, total, noun, page, pages, onPrev, onNext) => {
    const box = document.createElement('div');
    box.className = 'gs-pager';
    const prev = document.createElement('button');
    prev.className = 'gs-pagebtn';
    prev.textContent = '← Prev';
    prev.disabled = page === 0;
    prev.addEventListener('click', onPrev);
    const info = document.createElement('span');
    info.className = 'gs-pageinfo';
    info.textContent = (start + 1) + '–' + Math.min(start + PAGE, total) +
      ' of ' + total + ' ' + noun + ' · page ' + (page + 1) + '/' + pages;
    const next = document.createElement('button');
    next.className = 'gs-pagebtn';
    next.textContent = 'Next →';
    next.disabled = page >= pages - 1;
    next.addEventListener('click', onNext);
    box.appendChild(prev);
    box.appendChild(info);
    box.appendChild(next);
    return box;
  };

  const span = (cls, txt) => {
    const s = document.createElement('span');
    s.className = cls;
    s.textContent = txt;
    return s;
  };

  // ----- General -----
  const fmtNum = n => Number(n).toLocaleString('en-US');
  const fmtDur = ms => {
    const mins = Math.round((ms || 0) / 60000);
    return fmtNum(Math.floor(mins / 60)) + ' h ' + (mins % 60) + ' m';
  };
  const card = (value, label, sub) => {
    const c = document.createElement('div');
    c.className = 'gen-card';
    const v = document.createElement('div');
    v.className = 'gen-value';
    v.textContent = value;
    v.title = value;
    const l = document.createElement('div');
    l.className = 'gen-label';
    l.textContent = label;
    c.appendChild(v);
    c.appendChild(l);
    if (sub) {
      const s = document.createElement('div');
      s.className = 'gen-sub';
      s.textContent = sub;
      c.appendChild(s);
    }
    return c;
  };
  const section = (title, cards) => {
    const sec = document.createElement('div');
    sec.className = 'gen-section';
    const h = document.createElement('h2');
    h.textContent = title;
    sec.appendChild(h);
    const g = document.createElement('div');
    g.className = 'gen-grid';
    cards.forEach(c => g.appendChild(c));
    sec.appendChild(g);
    return sec;
  };
  function renderGeneral() {
    generalview.innerHTML = '';
    const st = D.stats || {}, tp = D.top || {}, rc = D.records || {};
    const sumCards = [
      card(fmtNum(st.plays || 0), 'Plays'),
      card(fmtNum(st.tracks || 0), 'Tracks'),
      card(fmtNum(st.artists || 0), 'Artists'),
      card(fmtNum(st.albums || 0), 'Albums'),
      card(fmtNum(st.full_albums || 0), 'Full albums')
    ];
    if ('ms_total' in st) {
      sumCards.splice(1, 0, card(fmtDur(st.ms_total), 'Listening time'));
    }
    generalview.appendChild(section('Summary', sumCards));
    const trk = tp.track || {}, alb = tp.album || {}, art = tp.artist || {};
    generalview.appendChild(section('Top', [
      card(art.name || '—', 'Top artist',
        art.name ? fmtNum(art.plays) + ' plays' : ''),
      card(trk.name || '—', 'Top track',
        trk.name ? trk.artist + ' · ' + fmtNum(trk.plays) + ' plays' : ''),
      card(alb.name || '—', 'Top album',
        alb.name ? alb.artist + ' · ' + fmtNum(alb.plays) + ' plays' : '')
    ]));
    const rk = rc.streak || {};
    generalview.appendChild(section('Records', [
      card(rc.busiest ? fmtNum(rc.busiest.plays) : '—', 'Busiest day',
        rc.busiest ? rc.busiest.date : ''),
      card(rk.days ? fmtNum(rk.days) : '—', 'Longest streak',
        rk.days ? (rk.start + ' → ' + rk.end) : ''),
      card(rc.avg_per_day != null ? fmtNum(rc.avg_per_day) : '—',
        'Avg plays / active day',
        rc.active_days ? fmtNum(rc.active_days) + ' active days' : '')
    ]));
    generalview.scrollIntoView({ block: 'start' });
  }

  // ----- Tracks -----
  let tpage = 0;
  function renderTracks() {
    tracksview.innerHTML = '';
    const list = D.tracks || [];
    const start = tpage * PAGE;
    const pages = Math.max(1, Math.ceil(list.length / PAGE));
    list.slice(start, start + PAGE).forEach(t => {
      const row = document.createElement('div');
      row.className = 'gs-row';
      row.dataset.artist = t.artist;
      row.appendChild(span('gs-name', t.name));
      row.appendChild(span('gs-artist', t.artist));
      row.appendChild(span('gs-plays', t.plays));
      row.addEventListener('mouseenter', () => {
        tracksview.querySelectorAll('.gs-row').forEach(r =>
          r.classList.toggle('hl', r.dataset.artist === t.artist));
      });
      row.addEventListener('mouseleave', () => {
        tracksview.querySelectorAll('.gs-row.hl').forEach(r =>
          r.classList.remove('hl'));
      });
      tracksview.appendChild(row);
    });
    tracksview.appendChild(pager(start, list.length, 'tracks', tpage, pages,
      () => { tpage--; renderTracks(); },
      () => { tpage++; renderTracks(); }));
    tracksview.scrollIntoView({ block: 'start' });
  }

  // ----- Artists -----
  let page = 0, artist = null;
  function renderStats() {
    statsview.innerHTML = '';
    if (!artist) {
      const list = D.general.artists;
      const start = page * PAGE;
      const pages = Math.max(1, Math.ceil(list.length / PAGE));
      list.slice(start, start + PAGE).forEach(a => {
        const row = document.createElement('div');
        row.className = 'gs-row click';
        row.appendChild(span('gs-name', a.name));
        row.appendChild(span('gs-plays', a.plays));
        row.addEventListener('click', () => { artist = a; renderStats(); });
        statsview.appendChild(row);
      });
      statsview.appendChild(pager(start, list.length, 'artists', page, pages,
        () => { page--; renderStats(); },
        () => { page++; renderStats(); }));
    } else {
      const head = document.createElement('div');
      head.className = 'gs-head';
      const back = document.createElement('button');
      back.className = 'gs-back';
      back.textContent = '← All artists';
      back.addEventListener('click', () => { artist = null; renderStats(); });
      head.appendChild(back);
      head.appendChild(span('gs-title', artist.name));
      head.appendChild(span('gs-sub',
        artist.plays + ' plays · ' + artist.albums.length + ' albums'));
      statsview.appendChild(head);
      artist.albums.forEach(al => {
        const row = document.createElement('div');
        row.className = 'gs-row click';
        row.appendChild(span('gs-name', al.name));
        row.appendChild(span('gs-plays', al.plays));
        let tracksBox = null;
        row.addEventListener('click', () => {
          if (tracksBox) { tracksBox.remove(); tracksBox = null; return; }
          tracksBox = document.createElement('div');
          tracksBox.className = 'gs-tracks';
          (al.tracks || []).forEach(t => {
            const tr = document.createElement('div');
            tr.className = 'gs-track';
            tr.appendChild(span('gs-tname', t.name));
            tr.appendChild(span('gs-tplays', t.plays));
            tracksBox.appendChild(tr);
          });
          row.after(tracksBox);
        });
        statsview.appendChild(row);
      });
    }
    statsview.scrollIntoView({ block: 'start' });
  }

  // ----- Tracks dynamics -----
  let tdpage = 0;
  function renderTrackDyn() {
    renderDyn(tracksdyn, D.track_dynamics, tdpage,
      it => it.name + ' — ' + it.artist,
      n => { tdpage = n; renderTrackDyn(); }, 'tracks', D.track_dyn_n);
  }

  // ----- Artists dynamics -----
  let adpage = 0;
  function renderArtistDyn() {
    renderDyn(artistsdyn, D.artist_dynamics, adpage,
      it => it.name,
      n => { adpage = n; renderArtistDyn(); }, 'artists', D.artist_dyn_n);
  }

  // ----- Albums: list / by year -----
  function renderAlbumList() {
    albumlist.innerHTML = '';
    (D.full_albums || []).forEach(a => {
      const row = document.createElement('div');
      row.className = 'gs-row click';
      row.appendChild(span('gs-name', a.album));
      row.appendChild(span('gs-artist', a.artist));
      row.appendChild(span('gs-plays', a.plays));
      let tracksBox = null;
      row.addEventListener('click', () => {
        if (tracksBox) { tracksBox.remove(); tracksBox = null; return; }
        tracksBox = document.createElement('div');
        tracksBox.className = 'gs-tracks';
        (a.tracks || []).forEach(t => {
          const tr = document.createElement('div');
          tr.className = 'gs-track';
          tr.appendChild(span('gs-tname', t.name));
          tr.appendChild(span('gs-tplays', t.plays));
          tracksBox.appendChild(tr);
        });
        row.after(tracksBox);
      });
      albumlist.appendChild(row);
    });
    albumlist.scrollIntoView({ block: 'start' });
  }

  // ----- Dynamics (shared timeline) -----
  const T0 = D.time_range ? D.time_range.min : 0;
  const T1 = D.time_range ? D.time_range.max : 1;
  const SPAN = Math.max(1, T1 - T0);
  const pos = ts => (ts - T0) / SPAN * 100;
  const pad2 = n => String(n).padStart(2, '0');
  const fmtDate = ts => {
    const d = new Date(ts * 1000);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  };
  const mkdiv = (cls, txt) => {
    const e = document.createElement('div');
    e.className = cls;
    e.textContent = txt;
    return e;
  };

  function renderDyn(container, items, page, labelFn, goPage, noun, nthN) {
    container.innerHTML = '';
    const all = items || [];
    const start = page * PAGE;
    const pages = Math.max(1, Math.ceil(all.length / PAGE));
    const axis = mkdiv('dyn-axis', '');
    axis.appendChild(mkdiv('dyn-name', ''));
    const aplot = mkdiv('dyn-plot', '');
    const y0 = new Date(T0 * 1000).getFullYear();
    const y1 = new Date(T1 * 1000).getFullYear();
    for (let y = y0; y <= y1; y++) {
      const p = pos(Date.UTC(y, 0, 1) / 1000);
      if (p < -0.5 || p > 100.5) continue;
      const tick = mkdiv('dyn-tick', y);
      tick.style.left = p + '%';
      aplot.appendChild(tick);
    }
    axis.appendChild(aplot);
    axis.appendChild(mkdiv('dyn-val', ''));
    container.appendChild(axis);
    all.slice(start, start + PAGE).forEach(it => {
      const row = mkdiv('dyn-row', '');
      const nm = mkdiv('dyn-name', labelFn(it));
      nm.title = labelFn(it);
      row.appendChild(nm);
      const plot = mkdiv('dyn-plot', '');
      const f = pos(it.first);
      if (it.nth != null) {
        const n = pos(it.nth);
        const line = mkdiv('dyn-line', '');
        line.style.left = Math.min(f, n) + '%';
        line.style.width = Math.abs(n - f) + '%';
        plot.appendChild(line);
      }
      const d1 = mkdiv('dyn-dot', '');
      d1.style.left = f + '%';
      d1.title = 'First play: ' + fmtDate(it.first);
      plot.appendChild(d1);
      if (it.nth != null) {
        const d2 = mkdiv('dyn-dot nth', '');
        d2.style.left = pos(it.nth) + '%';
        d2.title = nthN + 'th play: ' + fmtDate(it.nth);
        plot.appendChild(d2);
      }
      row.appendChild(plot);
      row.appendChild(mkdiv('dyn-val', it.plays));
      container.appendChild(row);
    });
    container.appendChild(pager(start, all.length, noun, page, pages,
      () => goPage(page - 1), () => goPage(page + 1)));
    container.scrollIntoView({ block: 'start' });
  }

  const SUBCFG = {
    general: {
      tabs: [],
      desc: { all: 'Your listening at a glance.' },
      panes: { all: generalview },
      render: { all: renderGeneral }
    },
    tracks: {
      tabs: [['all', 'All'], ['dynamics', 'Dynamics']],
      desc: {
        all: 'Most played tracks',
        dynamics: 'Each line: first play (green dot) → ' + D.track_dyn_n +
          'th play (white dot). Tracks with fewer than ' + D.track_dyn_n +
          ' plays show only the first dot.'
      },
      panes: { all: tracksview, dynamics: tracksdyn },
      render: { all: renderTracks, dynamics: renderTrackDyn }
    },
    artists: {
      tabs: [['all', 'All'], ['dynamics', 'Dynamics']],
      desc: {
        all: 'Most played artists',
        dynamics: 'Each line: first play (green dot) → ' + D.artist_dyn_n +
          'th play (white dot). Artists with fewer than ' + D.artist_dyn_n +
          ' plays show only the first dot.'
      },
      panes: { all: statsview, dynamics: artistsdyn },
      render: { all: renderStats, dynamics: renderArtistDyn }
    },
    albums: {
      tabs: [['list', 'All'], ['year', 'By year']],
      desc: {
        list: 'Most full played albums',
        year: "Top: full album plays by the album's release year. Below: artists sorted by total plays, dots show their plays in each year (shared year axis). Hover an artist or a dot to see the albums and the artist's share in the bars."
      },
      panes: { list: albumlist, year: chart },
      render: { list: renderAlbumList, year: () => {} }
    }
  };
  const subState = { general: 'all', tracks: 'all', artists: 'all',
                     albums: 'list' };
  const ALLPANES = [generalview, tracksview, tracksdyn, statsview, artistsdyn,
                    albumlist, chart];

  function showSub(v, key) {
    subState[v] = key;
    const cfg = SUBCFG[v];
    subtabs.querySelectorAll('.tab').forEach(b =>
      b.classList.toggle('active', b.dataset.sub === key));
    ALLPANES.forEach(p => { p.hidden = true; });
    cfg.panes[key].hidden = false;
    viewdesc.textContent = cfg.desc[key];
    const fn = cfg.render[key];
    if (fn) fn();
  }

  function showView(v) {
    tabs.querySelectorAll('.tab').forEach(b =>
      b.classList.toggle('active', b.dataset.view === v));
    const cfg = SUBCFG[v];
    subtabs.innerHTML = '';
    cfg.tabs.forEach(([key, label]) => {
      const b = document.createElement('button');
      b.className = 'tab';
      b.textContent = label;
      b.dataset.sub = key;
      b.addEventListener('click', () => showSub(v, key));
      subtabs.appendChild(b);
    });
    subtabs.hidden = cfg.tabs.length === 0;
    showSub(v, subState[v]);
  }

  tabs.querySelectorAll('.tab').forEach(b =>
    b.addEventListener('click', () => showView(b.dataset.view)));
  showView('general');
}
</script>
</body>
</html>
